# TinyCA configuration — the live config, loaded from ./config/tinyca.ini by
# default (-c/--config points somewhere else). Ready to run as it stands: every
# value below is the shipped default, and the only line most setups need to
# touch is llm.base_url.
#
# INI format: `key = value`, `#`/`;` comments, `[section]` headers, values
# trimmed, no quoting, no \n-escaping in values. Precedence when loading:
# CLI flag > this file > the built-in default. Nothing here is fatal: an
# unknown key, a malformed line, an unusable value and a duplicate key each
# produce a warning and leave the default standing, so a typo cannot stop an
# unattended session. Deleting this file is also fine -- TinyCA warns once and
# runs on built-in defaults.
#
# The inline comments below duplicate docs/MANUAL.md on purpose, so this file
# can be read on its own. docs/MANUAL.md is AUTHORITATIVE: if a comment here
# disagrees with it, the comment is the bug. SPEC.md §4 explains why the
# defaults are what they are.

[llm]
# Scheme + host + port of the llama-server (or other OpenAI-compatible local
# server) instance. Use an IP literal if the tinyca binary itself is
# statically linked (NSS/hostname resolution is unavailable then).
base_url = http://127.0.0.1:8080

# Overridden automatically to /completion whenever protocol.enable_grammar is
# true (SPEC.md §6.3) -- grammar is only honoured on the native completion
# endpoint on this server. Leave this alone; it exists mainly so the
# override has somewhere to write to.
api_path = /v1/chat/completions

# Echoed back to the server; arbitrary unless the server was started with an
# explicit --alias.
model_id = qwen2.5-coder-1.5b

# Sent as "Authorization: Bearer <api_key>". llama-server ignores it; this
# exists for other OpenAI-compatible local servers that might check it.
api_key = none

# Generous on purpose: this class of hardware generates at roughly 4-5
# tokens/second, so a long reply can legitimately take minutes.
request_timeout_s = 900
connect_timeout_s = 10

# Per-request generation cap.
max_tokens = 512

# Low temperature on purpose -- this is code, not prose.
temperature = 0.2
top_p = 0.9

# Must match the server's own -c flag; used only for the >80% context-budget
# warning and the hard abort past 100% (SPEC.md §9) -- never auto-summarised.
context_tokens = 4096

# SSE token streaming (SPEC.md §9.3). llama-server supports it on both
# endpoints. Turn this off for scripted/oneshot invocations piping output
# elsewhere, where incremental flushes add nothing -- or if talking to a
# server that doesn't speak SSE (e.g. tools/mockllm in tests).
stream = true

[protocol]
# fenced (default): the model emits one ```bash ... ``` block per turn.
# hermes: parallel-capable, structured tool_calls (SPEC.md §6).
tool_protocol = fenced

# GBNF grammar constraint (SPEC.md §6.3). hermes only -- ignored with a
# warning under tool_protocol=fenced. Forces api_path to /completion when on.
enable_grammar = false
grammar_file = grammars/hermes_tool_call.gbnf

# Remove <think>...</think> before parsing actions, and (separately) before
# replaying it in history. The transcript always gets the full reasoning
# regardless of these two flags.
strip_think = true
strip_think_from_history = true

# Comma-separated override for the protocol's own stop sequences. Leave
# empty to use the protocol default (``` fences for fenced, </tool_call> for
# hermes) -- there is rarely a good reason to change this.
#
# Entries are trimmed and used verbatim; there is no escape syntax, so a stop
# sequence containing a newline cannot be written here (the fenced defaults
# include one). Setting this replaces the protocol's list entirely.
stop_sequences =

[agent]
# Multi-line prompts don't belong in an INI value -- this points at a plain
# text file instead. The Tier 1 skills block (SPEC.md §7) is appended to it
# automatically at startup.
system_prompt_file = config/system_prompt.txt

# Hard cap on loop turns per task.
max_iterations = 8

# Consecutive identical turns (same set of commands) before the loop aborts
# -- small models can retry a failing command forever otherwise.
repetition_threshold = 2

# Execution jail for every bash command; created if it doesn't exist.
work_dir = ./workspace

# Append-only JSONL record of every request, response, command, and result
# -- the only diagnostic available when something goes wrong on-device.
# Where named sessions live: one transcript per session, so this directory is
# the session registry (SPEC.md §12.3). --session <name> and --list-sessions
# work on it, and a run that names no session gets one called
# YYYY-MM-DD_hh-mm-ss_<work dir basename> in here (local time).
sessions_dir = ./logs/sessions

# Fixed transcript path. Setting this explicitly opts OUT of named sessions:
# the run logs here instead of into sessions_dir. Leave it commented to let
# every session get a name. --resume <file> also overrides it, so a resumed
# session keeps writing to its own log (SPEC.md §12.2).
# transcript_log_path = ./logs/transcript.jsonl

# Cap on the transcript FILE's size; 0 = unlimited. The count starts from the
# size the file already has, so running TinyCA repeatedly against the same
# transcript cannot grow it past this number.
transcript_max_bytes = 0

# Cap on what a SINGLE RUN appends to the transcript; 0 = unlimited. Use this
# when you care about one session not running away, rather than about the
# file's total size -- a fresh run always gets a fresh budget.
#
# Must be <= transcript_max_bytes when both are set; a larger value is clamped
# down to it with a warning. Whichever cap is reached first stops appending for
# the rest of the run and writes one cutoff line naming the cap that tripped.
# Existing entries are never rotated or trimmed. Both are diagnostic safety
# valves for a device with limited storage, not general log rotation.
#
# A cap below 256 bytes cannot hold one entry plus the cutoff marker and leaves
# the transcript empty; TinyCA warns at startup if you set one.
transcript_max_bytes_per_run = 0

# error | warn | info | debug -- console logging verbosity. -v/--verbose
# forces debug regardless of this value.
log_level = info

# interactive (REPL) | oneshot. Set to oneshot automatically by -p/--prompt.
mode = interactive

# auto (colour only when stdout is a real terminal) | always | never.
color_output = auto

[tools]
# Per-command timeout; SIGKILL on expiry, targeting the whole process group
# so a backgrounded grandchild can't outlive it.
bash_timeout_s = 60

# Output truncation (SPEC.md §8): keep the first N and last M lines with a
# "... lines omitted ..." marker between them, then hard-cap total bytes.
# The byte cap is strict -- the truncation marker is counted inside it, so what
# the model is shown is never longer than output_max_bytes.
output_head_lines = 40
output_tail_lines = 40
output_max_bytes = 4096

# whitelist (default, safest) | blacklist | none (SPEC.md §8.1).
command_filter_mode = whitelist

# Programs to confirm before EVERY run, even though the filter allows them
# (comma-separated head tokens). The point: whitelisting an interpreter grants
# everything that interpreter can do -- `python3 -c "import os; os.system(...)"`
# has the head token `python3` and passes the whitelist, and the same is true
# of awk, sed -i, make, gcc and git. The filter screens which *programs* run;
# it is not a sandbox (SPEC.md §8.1).
#
# This is independent of confirm_mode: --no-confirm does NOT clear it, exactly
# like on_blocked_command. So in an UNATTENDED run (oneshot, no TTY) a listed
# program cannot be approved and is reported to the model as blocked -- which
# fails closed, but will stop a script that legitimately needs python3. Clear
# this list for unattended use, or drop the interpreter from the whitelist
# instead.
#
# Built-in default is empty; this file ships the interpreters because a local
# model writing shell is exactly the case where you want to see it coming.
confirm_commands = python3,awk,sed

# Head tokens checked against command_filter_mode=whitelist. A discovered
# skill's path is always allowed regardless of this list or the mode below.
whitelist = ls,cat,grep,find,wc,head,tail,pwd,echo,mkdir,cp,mv,touch,make,gcc,g++,python3,git,sed,awk,diff,wget

# Head tokens checked against command_filter_mode=blacklist.
blacklist = rm,dd,mkfs,shutdown,reboot,sudo,su,chmod,chown,kill,pkill,killall,mount,umount

# ask (default): prompt interactively, same shape as Claude Code's own
# command-approval prompt -- allow runs it once, block tells the model the
# *user* blocked it (distinct from an automatic filter denial).
# deny: reject outright, no interaction, tell the model why.
on_blocked_command = ask

# always: also prompt before every command the filter already allowed
# (belt-and-suspenders). never (default): skip that extra prompt -- the
# filter and on_blocked_command are the safety net.
confirm_mode = never

# false (default, safe): reject $(), `, >, <, and a lone & outright, in
# every command_filter_mode. true: allow them -- document any use of this
# as unsafe, oneshot-sandbox-only.
allow_metacharacters = false

[skills]
skills_dir = ./skills

# Render the Tier 1 skills index into the system prompt (SPEC.md §7).
tier1_enabled = true

# Tier 2 (SPEC.md §7): honour "show_skill: <name>" to pull a skill's full
# source into the conversation. Off by default -- it asks the model to emit an
# exact trigger line, which a 1.5B model does not do reliably; turn it on with
# a more capable model. When on, the trigger is announced in the system prompt
# and you can also type "show_skill: <name>" yourself in the REPL (TAB
# completes the name), which costs no LLM call.
tier2_enabled = false

# Safeguards around skills the MODEL writes via the add_skill skill
# (SPEC.md §7.1). A skill is auto-allowed as a whole, so without these its
# body would never face the command filter -- the model could write a
# forbidden command into a skill and then run the skill. Comma-separated,
# any subset of:
#   filter_on_create  - screen a newly created skill and DELETE it if its body
#                       invokes a program the filter forbids
#   confirm_on_create - ask before the skill-creating skill runs at all
#   filter_at_startup - screen every skill at startup; failures are dropped
#                       (not advertised to the model, not auto-allowed)
# Use "none" to disable all three (oneshot sandboxes only).
skill_checks = filter_on_create,filter_at_startup

# Which skill confirm_on_create applies to -- the one that creates skills.
add_skill_name = add_skill

# Skills to keep OUT of the Tier 1 index (comma-separated names). They stay
# discovered, auto-allowed and loadable via Tier 2 -- they are simply not
# advertised to the model.
#
# add_skill is excluded by default for a measured reason: shown a "register a
# skill" capability, a 1.5B model treats it as a shortcut for doing the work.
# In a real run it abandoned a compile-and-run task, invented a GitHub URL to
# download a skill from, and registered a junk skill instead (SPEC.md §16).
# Clear this when you point TinyCA at a model capable of using it well.
tier1_exclude = add_skill

# Beyond this many discovered skills, small-model tool selection degrades;
# extras are omitted from Tier 1 (not deleted -- still loadable via Tier 2's
# show_skill: trigger) with a startup warning.
max_tier1_skills = 8
