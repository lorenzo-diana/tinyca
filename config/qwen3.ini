# TinyCA configuration for Qwen3-4B-Thinking-2507 served from another machine.
#
#   ./build/tinyca -c config/qwen3.ini
#
# Config files do NOT layer: this file is read *instead of* config/tinyca.ini,
# and every key absent here falls back to the BUILT-IN default, not to the
# value in tinyca.ini. That is why a few keys below are repeated even though
# they are unchanged from the shipped config -- dropping them would silently
# change behaviour.
#
# Everything here is set because the shipped defaults are tuned for
# Qwen2.5-Coder-1.5B on the Jetson, and a reasoning model is a different
# animal. docs/MANUAL.md remains authoritative for what each key does.
#
# TUNED FOR THE *THINKING* VARIANT. When this file was written the endpoint
# was serving unsloth/Qwen3-4B-Instruct-2507 instead, which is a different
# model with the same family name: it returns no reasoning at all and answers
# in under a second rather than minutes. TinyCA will say so on the first turn:
#
#   [warn] the server is serving '...-Instruct-...', not llm.model_id '...-Thinking-...'
#
# That warning is the file doing its job -- believe the server. For the
# Instruct variant, change model_id to match, drop show_thinking (there is no
# reasoning to show), and use its own recommended sampling (temperature 0.7,
# top_p 0.8); max_tokens and the long timeout below do no harm but are not
# needed.

[llm]
# The second machine, not the Jetson's local llama-server.
base_url = http://192.168.1.51:8000

# A label only -- llama-server ignores it. It is set to exactly what this
# server reports so the "serving X, not llm.model_id Y" warning stays quiet;
# if you point this file at different weights, expect that warning and believe
# the server, not this line.
model_id = unsloth/Qwen3-4B-Thinking-2507-GGUF:Q4_K_M

# Qwen3's own recommended sampling for the thinking models. This is the
# setting that matters most here: measured against this endpoint with TinyCA's
# system prompt, 0.2/0.9 (the Qwen2.5-Coder defaults) produced 8.6 KB of
# reasoning and NO answer at all, twice in a row, so the run aborted on two
# empty turns. At 0.6/0.95 the same prompt produced its reasoning and then a
# correct fenced command, finishing normally in 1938 tokens.
temperature = 0.6
top_p = 0.95

# The budget has to cover the thinking as well as the answer, and on this
# model the thinking is the larger part by far. 8192 leaves headroom over the
# ~1900 tokens a simple task took; raise it further for multi-step work.
max_tokens = 8192

# Must match the server's -c (it was started with -c 16384). TinyCA cannot
# discover this and uses it for the context-budget warning and abort.
context_tokens = 16384

# Reasoning arrives as its own stream, so leaving this on shows the model
# thinking rather than a blank terminal for minutes.
stream = true

# This model generates slowly and thinks at length: one reply measured 5m48s.
# The 900s default would abort a long turn mid-flight; 1800s covers a full
# max_tokens generation at the observed rate.
request_timeout_s = 1800

[agent]
# Show the reasoning as it streams. Without this the terminal sits blank for
# minutes and then prints one line -- the thinking IS the visible work here.
show_thinking = true

[tools]
# Repeated from the shipped config on purpose: configs do not layer, and the
# built-in default for this key is empty, so omitting it would quietly stop
# asking before an interpreter runs.
confirm_commands = python3,awk,sed
